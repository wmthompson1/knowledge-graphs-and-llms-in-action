[tool.poetry]
name = "langgraph-api-orchestrator"
version = "0.1.0"
description = "LangGraph 1.0 API Orchestration with HITL checkpoints"
authors = ["William Thompson"]
readme = "README.md"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=0.2.20"
langchain-core = ">=0.3.0"
langchain-openai = ">=0.2.0"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
pydantic = ">=2.8.0"
typing-extensions = ">=4.12.0"
requests = ">=2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
httpx = ">=0.27.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"